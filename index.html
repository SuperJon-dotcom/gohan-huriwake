<script>
(function () {
  const L = window.GohanLogic;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const fmtDate = (s) => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return m + "/" + d + "（" + "日月火水木金土"[new Date(y, m - 1, d).getDay()] + "）"; };
  const GL = "ABCDEFGHIJ";
  const STATUS = { draft: "準備中", published: "公開中", done: "終了・反映済み" };

  // ================= データ保存 =================
  // freshmen = 1年、seniors = 2・3年（振り分けとポイントの対象）、elders = 4年（ログインとコメントだけ）
  const empty = () => ({ seniors: {}, freshmen: {}, elders: {}, days: {} });
  let state = empty();
  let canEdit = false;
  let ready = false;
  let noKey = false;
  // 自分のPC（localhost）で開いたときは本番のデータに触れないテストモードにする
  const onDevHost = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const Store = { mode: window.FIREBASE_CONFIG && !onDevHost ? "firebase" : "local", ref: null };
  let editorApp = null;
  const editorAuth = () => editorApp.auth();

  function normalize(d) {
    const s = Object.assign(empty(), d || {});
    s.seniors = s.seniors || {}; s.freshmen = s.freshmen || {}; s.elders = s.elders || {}; s.days = s.days || {};
    return s;
  }

  // テストモードの保存先。領収書の画像が入ると localStorage では足りないので IndexedDB を使う
  const LocalDB = {
    open() {
      return this.p || (this.p = new Promise((ok, ng) => {
        const r = indexedDB.open("gohan", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
      }));
    },
    async get(k) {
      const db = await this.open();
      return new Promise((ok, ng) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ng(q.error); });
    },
    async set(k, v) {
      const db = await this.open();
      return new Promise((ok, ng) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => ok(); t.onerror = () => ng(t.error); });
    },
  };
  async function loadLocal() {
    try { const s = await LocalDB.get("state"); if (s) return s; } catch (e) { console.error(e); }
    try { return JSON.parse(localStorage.getItem("gohan-state") || "null"); } catch (e) { return null; }
  }

  function startStore() {
    if (Store.mode === "local") {
      // ?viewer を付けると部員から見た画面を確認できる
      canEdit = !/[?&]viewer\b/.test(location.search);
      // 部員の画面でもログイン画面（おふざけモードの確認用）を開けるようにする
      if (!canEdit) $("#b-login").hidden = false;
      // 共有したときのプレビューに出ないよう、文言はHTMLに書かずにここで入れる
      $("#banner").textContent = "テストモード：データはこの端末にだけ保存されます";
      $("#banner").hidden = false;
      // PCで共有リンクの鍵（#以降）付きで開いたときは、本番のデータを読み込むボタンを出す
      if (onDevHost && canEdit && window.FIREBASE_CONFIG && location.hash.length > 1)
        $("#banner").insertAdjacentHTML("beforeend", ' <button class="btn small" type="button" data-import-live>本番のデータを取り込む</button>');
      loadLocal().then((s) => { state = normalize(s); ready = true; render(); });
      return;
    }
    // データの場所は共有リンクの # 以降（鍵）で決まる。鍵はプログラムに書かない
    const key = decodeURIComponent(location.hash.slice(1));
    if (!/^[A-Za-z0-9_-]{16,}$/.test(key)) {
      ready = true; noKey = true; render();
      return;
    }
    firebase.initializeApp(window.FIREBASE_CONFIG);
    Store.ref = firebase.firestore().doc("spaces/" + key);
    Store.ref.onSnapshot((snap) => {
      state = normalize(snap.exists ? snap.data() : null);
      ready = true; render();
    }, (e) => { console.error(e); ready = true; toast("データを読み込めませんでした"); render(); });
    let first = true;
    Store.ref.collection("comments").onSnapshot((snap) => {
      remoteComments = snap.docs.map((doc) => {
        const x = doc.data({ serverTimestamps: "estimate" });
        return { id: doc.id, dayId: x.dayId, name: x.name, text: x.text, uid: x.uid || null, pid: x.pid || null, by: x.by || null, joke: !!x.joke, deletedAt: x.deletedAt || null, at: x.at && x.at.toMillis ? x.at.toMillis() : Date.now() };
      });
      if (!first && canEdit) {
        const added = snap.docChanges().filter((c) => c.type === "added" && !c.doc.metadata.hasPendingWrites);
        if (added.length) toast("新しいコメント：" + (added[0].doc.data().name || ""));
      }
      first = false;
      render();
    }, (e) => console.error(e));
    const toMap = (snap) => { const m = {}; snap.forEach((d) => { m[d.id] = d.data(); }); return m; };
    // 名前の使用状況が両方とも届いてから「あなたはだれですか」を出す
    const loaded = new Set();
    const idSnap = (k, set) => (snap) => { set(toMap(snap)); loaded.add(k); idReady = loaded.size === 2; render(); };
    Store.ref.collection("owners").onSnapshot(idSnap("o", (m) => { remoteOwners = m; }), (e) => console.error(e));
    Store.ref.collection("names").onSnapshot(idSnap("n", (m) => { remoteNames = m; }), (e) => console.error(e));
    // 部員としての匿名ログイン（端末の ID）と編集ログインは別々のアプリで持つ。
    // 同じアプリだと編集ログインで匿名ログインが置き換わり、ログアウト後に端末の名前が消えてしまう
    const memberRef = Store.ref;
    firebase.auth().onAuthStateChanged((u) => {
      // 以前の版で既定のアプリにメールでログインしていた端末は、匿名ログインに戻す（編集ログインはやり直し）
      if (u && !u.isAnonymous) { firebase.auth().signOut(); return; }
      if (!u) firebase.auth().signInAnonymously().catch((e) => console.error(e));
      render();
    });
    editorApp = firebase.initializeApp(window.FIREBASE_CONFIG, "editor");
    const editorRef = editorApp.firestore().doc("spaces/" + key);
    let jokerOff = null;
    editorApp.auth().onAuthStateChanged((u) => {
      canEdit = !!u && !u.isAnonymous;
      // 書き込みは、編集中なら編集者として、そうでなければ部員（匿名）として行う
      Store.ref = canEdit ? editorRef : memberRef;
      // 編集ログインしたらおふざけモードは終える（ログアウト後に勝手に戻らないように）
      if (canEdit) setJoke(false);
      // おふざけモードの記録は編集者だけが読める
      if (canEdit && !jokerOff) jokerOff = editorRef.collection("jokers").onSnapshot((snap) => { remoteJokers = toMap(snap); render(); }, (e) => console.error(e));
      if (!canEdit && jokerOff) { jokerOff(); jokerOff = null; remoteJokers = {}; }
      render();
    });
    $("#b-login").hidden = false;
  }

  // コメントは本体とは別に保存する（部員も書き込むため）。テストモードでは state.comments に入れる
  let remoteComments = [];
  // trashed = true でゴミ箱の中身を返す
  function dayComments(dayId, trashed) {
    const all = Store.mode === "local" ? Object.entries(state.comments || {}).map(([id, c]) => ({ id, ...c })) : remoteComments;
    return all.filter((c) => c.dayId === dayId && !!c.deletedAt === !!trashed).sort((a, b) => b.at - a.at);
  }

  // ================= 端末の識別（荒らし対策） =================
  // 本番は匿名ログインの uid が端末の ID。テストモードは端末内の乱数で、?device=名前 を付けると別の端末のふりができる
  function myUid() {
    if (Store.mode !== "local") { const u = firebase.auth().currentUser; return u && u.isAnonymous ? u.uid : null; }
    const m = location.search.match(/[?&]device=([^&]+)/);
    if (m) return "dev-" + decodeURIComponent(m[1]);
    try {
      let id = localStorage.getItem("gohan-dev-device");
      if (!id) { id = "dev-" + uid(); localStorage.setItem("gohan-dev-device", id); }
      return id;
    } catch (e) { return "dev-tmp"; }
  }
  // 編集者に見せる端末の短い記号（uid から作る4文字）
  const devCode = (u) => {
    let h = 2166136261;
    for (const ch of String(u)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
    return (h >>> 0).toString(36).toUpperCase().slice(-4).padStart(4, "0");
  };
  // owners: 端末(uid) → {pid, name}、names: 部員(pid) → {uid}。最初に名前を選んだときに両方を作り、以後は変えられない（解除は編集者だけ）
  let remoteOwners = {}, remoteNames = {}, idReady = Store.mode === "local";
  const ownersMap = () => (Store.mode === "local" ? state.owners || {} : remoteOwners);
  const namesMap = () => (Store.mode === "local" ? state.names || {} : remoteNames);
  const blockedMap = () => state.blocked || {};

  // この端末でログインしている部員（なければ null）
  function myPerson() {
    const me = myUid();
    const o = me && ownersMap()[me];
    if (!o || !o.pid) return null;
    const n = namesMap()[o.pid];
    if (!n || n.uid !== me) return null;
    return people()[o.pid] || null;
  }
  const guestKey = () => "gohan-guest:" + myUid();
  function isGuest() { try { return localStorage.getItem(guestKey()) === "1"; } catch (e) { return false; } }
  function setGuest(on) { try { on ? localStorage.setItem(guestKey(), "1") : localStorage.removeItem(guestKey()); } catch (e) {} }

  // 名前を決める。戻り値: ok / noauth / taken / error
  async function claimName(pid) {
    const me = myUid();
    const p = people()[pid];
    if (!me) return "noauth";
    if (!p) return "error";
    const holder = namesMap()[pid];
    if (holder && holder.uid !== me) return "taken";
    if (Store.mode === "local") {
      const ok = await save((s) => {
        s.owners = s.owners || {}; s.names = s.names || {};
        s.owners[me] = { pid, name: p.name, at: Date.now() };
        s.names[pid] = { uid: me, at: Date.now() };
      });
      return ok ? "ok" : "error";
    }
    try {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      const b = Store.ref.firestore.batch();
      b.set(Store.ref.collection("owners").doc(me), { pid, name: p.name, at: ts });
      b.set(Store.ref.collection("names").doc(pid), { uid: me, at: ts });
      await b.commit();
      return "ok";
    } catch (e) { console.error(e); return namesMap()[pid] ? "taken" : "error"; }
  }

  // 投稿できるか。編集者は代理で誰の名前でも書ける。戻り値: null（書ける） / noauth / nologin / blocked
  function postCheck(pid) {
    const me = myUid();
    if (!me) return "noauth";
    if (canEdit) return pid && people()[pid] ? null : "nologin";
    if (blockedMap()[me]) return "blocked";
    return myPerson() ? null : "nologin";
  }
  const POST_MSG = {
    noauth: "準備中です。少し待ってからもう一度押してください",
    nologin: "名前を決めるとコメントや領収書を送れます",
    blocked: "この端末からは送れません",
    error: "送れませんでした。公開中の日程か確認してください",
  };

  // ================= おふざけモード =================
  // 特定のメールアドレスとパスワードで、他の部員になりすましてコメントできる。
  // 合言葉そのものはプログラムに書かず、ハッシュをFirestoreのルールの中だけで照合する（テストモードは下の仮の合言葉）
  // jokers/{uid} = {pid, name, key, at（初めてのログイン）, lastAt}。全体の禁止は jokeOff、端末ごとの禁止は jokeBlocked
  const DEV_JOKE = { mail: "joke@test.local", pass: "ofuzake" };
  const jokeWaitMs = () => (onDevHost && /[?&]jokefast\b/.test(location.search) ? 0 : 22 * 3600 * 1000);
  let remoteJokers = {};
  const jokersMap = () => (Store.mode === "local" ? state.jokers || {} : remoteJokers);
  const jokeBlockedMap = () => state.jokeBlocked || {};
  async function sha256hex(s) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join("");
  }
  const jokeKeyOf = (mail, pass) => sha256hex("gohan-joke\n" + mail.trim().toLowerCase() + "\n" + pass);
  const jokeFlag = () => "gohan-joke:" + myUid();
  function setJoke(on) { try { on ? localStorage.setItem(jokeFlag(), "1") : localStorage.removeItem(jokeFlag()); } catch (e) {} }
  // 名前を登録していて、どこからも止められていない端末だけ
  function jokeBasicOk() {
    const me = myUid(), o = me && ownersMap()[me];
    if (canEdit || !o || !myPerson()) return false;
    return !(state.jokeOff || jokeBlockedMap()[me] || blockedMap()[me]);
  }
  // 名前の登録から22時間たったか（初めておふざけモードに入るときだけ必要）
  function jokeWaited() {
    const o = ownersMap()[myUid()];
    return !!o && tsMs(o.at) > 0 && Date.now() - tsMs(o.at) >= jokeWaitMs();
  }
  function jokeActive() {
    let on = false;
    try { on = localStorage.getItem(jokeFlag()) === "1"; } catch (e) {}
    const me = myUid();
    return on && !canEdit && !!myPerson() && !state.jokeOff && !jokeBlockedMap()[me] && !blockedMap()[me];
  }
  // 合言葉が合っていれば true。違う・条件を満たさないときは false（編集ログインとして続けて試す）
  async function tryJoke(mail, pass) {
    if (!jokeBasicOk()) return false;
    const key = await jokeKeyOf(mail, pass), me = myUid(), p = myPerson();
    if (Store.mode === "local") {
      if (key !== (await jokeKeyOf(DEV_JOKE.mail, DEV_JOKE.pass))) return false;
      // 一度入ったことのある端末は22時間の条件なし
      if (!(state.jokers || {})[me] && !jokeWaited()) return false;
      const ok = await save((s) => {
        s.jokers = s.jokers || {};
        if (s.jokers[me]) s.jokers[me].lastAt = Date.now();
        else s.jokers[me] = { pid: p.id, name: p.name, key, at: Date.now(), lastAt: Date.now() };
      });
      if (ok) setJoke(true);
      return ok;
    }
    const ref = Store.ref.collection("jokers").doc(me), ts = firebase.firestore.FieldValue.serverTimestamp();
    try {
      const snap = await ref.get();
      // 一度入ったことのある端末は22時間の条件なし（ルールも2回目以降は見ない）
      if (snap.exists) await ref.update({ key, lastAt: ts });
      else if (jokeWaited()) await ref.set({ pid: p.id, name: p.name, key, at: ts, lastAt: ts });
      else return false;
      setJoke(true);
      return true;
    } catch (e) { return false; }
  }

  // 編集者は合言葉なしで、この端末の部員の名前のままおふざけモードに入れる（編集ログインは終える）。
  // 記録には byEditor を付け、ルールはそれを合言葉の代わりに認める（合言葉もそのハッシュもプログラムには書かない）
  async function enterJokeAsEditor() {
    const me = myUid(), p = myPerson();
    if (!me || !p) { toast("先に画面上部の「名前を決める」で、この端末の名前を決めてください"); return; }
    if (state.jokeOff) { toast("おふざけモードは全体で禁止中です"); return; }
    if (jokeBlockedMap()[me] || blockedMap()[me]) { toast("この端末はおふざけモードを禁止されています"); return; }
    if (Store.mode === "local") {
      const ok = await save((s) => {
        s.jokers = s.jokers || {};
        if (s.jokers[me]) s.jokers[me].lastAt = Date.now();
        else s.jokers[me] = { pid: p.id, name: p.name, key: "editor", byEditor: true, at: Date.now(), lastAt: Date.now() };
      });
      if (!ok) return;
      setJoke(true);
      // テストモードは ?viewer で部員の画面に切り替える
      location.search = location.search ? location.search + "&viewer" : "?viewer";
      return;
    }
    try {
      const ref = Store.ref.collection("jokers").doc(me), ts = firebase.firestore.FieldValue.serverTimestamp();
      const snap = await ref.get();
      if (snap.exists) await ref.update({ lastAt: ts, byEditor: true });
      else await ref.set({ pid: p.id, name: p.name, key: "editor", byEditor: true, at: ts, lastAt: ts });
      setJoke(true);
      await editorAuth().signOut();
      toast("おふざけモード ON（編集ログインは終了しました）");
    } catch (e) { console.error(e); toast("おふざけモードに入れませんでした"); }
  }

  // 戻り値: ok / noauth / nologin / blocked / error
  async function postComment(dayId, pid, text) {
    // おふざけ中は選んだ人の名前で書ける（本当の書き手は by に残す）
    const mine = myPerson() && myPerson().id;
    const joke = !canEdit && jokeActive() && pid && pid !== mine && !!people()[pid];
    if (!canEdit && !joke) pid = mine;
    const bad = postCheck(pid);
    if (bad) return bad;
    const me = myUid(), name = people()[pid].name;
    const extra = joke ? { by: mine, joke: true } : {};
    if (Store.mode === "local") {
      const ok = await save((s) => { s.comments = s.comments || {}; s.comments[uid()] = Object.assign({ dayId, name, text, uid: me, pid, at: Date.now() }, extra); });
      return ok ? "ok" : "error";
    }
    try {
      await Store.ref.collection("comments").add(Object.assign({ dayId, name, text, uid: me, pid, at: firebase.firestore.FieldValue.serverTimestamp() }, extra));
      return "ok";
    } catch (e) { console.error(e); return "error"; }
  }
  // ログインを解除する（本人が別の端末に替えたときなど）。u は端末の uid
  async function releaseOwner(u) {
    const own = ownersMap()[u];
    const pid = own && own.pid;
    const ownsName = pid && namesMap()[pid] && namesMap()[pid].uid === u;
    if (Store.mode === "local") return save((s) => { if (s.owners) delete s.owners[u]; if (ownsName) delete s.names[pid]; }, "ログインを解除しました");
    const b = Store.ref.firestore.batch();
    b.delete(Store.ref.collection("owners").doc(u));
    if (ownsName) b.delete(Store.ref.collection("names").doc(pid));
    return b.commit().then(() => toast("ログインを解除しました"), (e) => { console.error(e); toast("解除できませんでした"); });
  }
  function setBlocked(u, on) {
    const own = ownersMap()[u];
    const p = own && people()[own.pid];
    return save((s) => {
      s.blocked = s.blocked || {};
      if (on) s.blocked[u] = { name: p ? p.name : (own && own.name) || "", at: Date.now() };
      else delete s.blocked[u];
    }, on ? "この端末からの投稿を止めました" : "ブロックを解除しました");
  }
  // 削除はまずゴミ箱へ（deletedAt を付けるだけ）。完全に消すのはゴミ箱から。kind は "comments" か "receipts"
  const TRASH_MSG = { trash: "削除しました（ゴミ箱から戻せます）", restore: "元に戻しました", purge: "完全に削除しました" };
  function trashOp(kind, id, op) {
    if (Store.mode === "local") return save((s) => {
      const x = s[kind] && s[kind][id];
      if (!x) return;
      if (op === "purge") delete s[kind][id];
      else if (op === "trash") x.deletedAt = Date.now();
      else delete x.deletedAt;
    }, TRASH_MSG[op]);
    const ref = Store.ref.collection(kind).doc(id);
    const p = op === "purge" ? ref.delete() : ref.update({ deletedAt: op === "trash" ? Date.now() : firebase.firestore.FieldValue.delete() });
    return p.then(() => toast(TRASH_MSG[op]), (e) => { console.error(e); toast("できませんでした。ログイン状態を確認してください"); });
  }

  // 領収書は画像が大きいので、開いている日程の分だけ読み込む。テストモードでは state.receipts に入れる
  let remoteReceipts = [], rcWatch = { dayId: null, off: null };
  function watchReceipts(dayId) {
    if (Store.mode === "local" || !Store.ref || rcWatch.dayId === dayId) return;
    if (rcWatch.off) rcWatch.off();
    remoteReceipts = [];
    rcWatch = { dayId, off: null };
    if (!dayId) return;
    rcWatch.off = Store.ref.collection("receipts").where("dayId", "==", dayId).onSnapshot((snap) => {
      remoteReceipts = snap.docs.map((doc) => {
        const x = doc.data({ serverTimestamps: "estimate" });
        return { id: doc.id, dayId: x.dayId, name: x.name, pid: x.pid || null, uid: x.uid || null, note: x.note || "", image: x.image, deletedAt: x.deletedAt || null, at: x.at && x.at.toMillis ? x.at.toMillis() : Date.now() };
      });
      render();
    }, (e) => console.error(e));
  }
  function dayReceipts(dayId, trashed) {
    const all = Store.mode === "local" ? Object.entries(state.receipts || {}).map(([id, r]) => ({ id, ...r })) : remoteReceipts;
    return all.filter((r) => r.dayId === dayId && !!r.deletedAt === !!trashed).sort((a, b) => b.at - a.at);
  }
  // 戻り値: ok / noauth / nologin / blocked / error
  async function postReceipt(dayId, pid, note, image) {
    if (!canEdit) pid = myPerson() && myPerson().id;
    const bad = postCheck(pid);
    if (bad) return bad;
    const me = myUid(), name = people()[pid].name;
    if (Store.mode === "local") {
      const ok = await save((s) => { s.receipts = s.receipts || {}; s.receipts[uid()] = { dayId, name, pid, uid: me, note, image, at: Date.now() }; });
      return ok ? "ok" : "error";
    }
    try {
      await Store.ref.collection("receipts").add({ dayId, name, pid, uid: me, note, image, at: firebase.firestore.FieldValue.serverTimestamp() });
      return "ok";
    } catch (e) { console.error(e); return "error"; }
  }

  // ================= バックアップ =================
  // 日程・メンバー・コメント・領収書（画像込み）を1つの JSON にまとめる
  async function collectRemote(ref) {
    // owners / names はルールが古いと読めないので、読めなければ空として扱う
    const opt = (q) => q.get().catch(() => ({ forEach() {} }));
    const [main, cs, rs, os, ns, js] = await Promise.all([ref.get(), ref.collection("comments").get(), ref.collection("receipts").get(),
      opt(ref.collection("owners")), opt(ref.collection("names")), opt(ref.collection("jokers"))]);
    const plain = (doc) => { const x = doc.data(); Object.keys(x).forEach((k) => { if (x[k] && x[k].toMillis) x[k] = x[k].toMillis(); }); return x; };
    const out = { app: "gohan-huriwake", version: 1, savedAt: Date.now(), main: main.exists ? main.data() : empty(), comments: {}, receipts: {}, owners: {}, names: {}, jokers: {} };
    cs.forEach((d) => { out.comments[d.id] = plain(d); });
    rs.forEach((d) => { out.receipts[d.id] = plain(d); });
    os.forEach((d) => { out.owners[d.id] = plain(d); });
    ns.forEach((d) => { out.names[d.id] = plain(d); });
    return out;
  }
  async function collectBackup() {
    if (Store.mode !== "local") return collectRemote(Store.ref);
    const { comments, receipts, owners, names, jokers, ...main } = clone(state);
    return { app: "gohan-huriwake", version: 1, savedAt: Date.now(), main, comments: comments || {}, receipts: receipts || {}, owners: owners || {}, names: names || {}, jokers: jokers || {} };
  }
  function stamp(t) {
    const d = new Date(t), p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }
  async function downloadBackup() {
    const data = await collectBackup();
    const a = document.createElement("a");

    a.download = "gohan-backup-" + stamp(data.savedAt) + ".json";

    setTimeout(() => URL.revokeObjectURL(a.href), 60000);

  // 復元: 日程・メンバーはファイルの時点に戻す。コメント・領収書はファイルにあるものを書き戻す（後から増えた分は残す）
  async function restoreBackup(b) {
    if (Store.mode === "local") {
      return save((s) => {
        Object.assign(s, normalize(b.main));
        s.comments = Object.assign(s.comments || {}, b.comments || {});
        s.receipts = Object.assign(s.receipts || {}, b.receipts || {});
        s.owners = Object.assign(s.owners || {}, b.owners || {});
        s.names = Object.assign(s.names || {}, b.names || {});
        s.jokers = Object.assign(s.jokers || {}, b.jokers || {});
      });
    }
    const ts = (x) => Object.assign({}, x, { at: firebase.firestore.Timestamp.fromMillis(Number(x.at) || Date.now()) });
    await Store.ref.set(b.main);
    await Promise.all(Object.entries(b.comments || {}).map(([id, c]) => Store.ref.collection("comments").doc(id).set(ts(c))));
    await Promise.all(Object.entries(b.owners || {}).map(([id, o]) => Store.ref.collection("owners").doc(id).set(ts(o))));
    await Promise.all(Object.entries(b.names || {}).map(([id, n]) => Store.ref.collection("names").doc(id).set(ts(n))));
    await Promise.all(Object.entries(b.jokers || {}).map(([id, j]) => Store.ref.collection("jokers").doc(id).set(ts(j))));
    for (const [id, r] of Object.entries(b.receipts || {})) await Store.ref.collection("receipts").doc(id).set(ts(r));
    return true;
  }
  const isBackup = (b) => b && b.app === "gohan-huriwake" && b.main && typeof b.main === "object";
  // PCのテストモードに、本番のデータをまるごと写す（本番は読むだけ）

  // 描画のたびに大きな data URL を流し込まないよう、画像は一度だけ blob URL にしておく
  const rcUrls = new Map();
  function receiptUrl(r) {
    if (!rcUrls.has(r.id)) {
      try {
        const bin = atob(r.image.slice(r.image.indexOf(",") + 1));
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        rcUrls.set(r.id, URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" })));
      } catch (e) { return r.image; }
    }
    return rcUrls.get(r.id);
  }
  // 画像をスマホ側で縮めて JPEG の data URL にする（1件 約900KB 以内）
  async function compressImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
      let max = 1600, q = 0.8, data = "";
      for (let n = 0; n < 12; n++) {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL("image/jpeg", q);
        if (data.length <= 900000) return data;
        if (q > 0.55) q -= 0.1; else max = Math.round(max * 0.8);
      }
      return null;
    } finally { URL.revokeObjectURL(url); }
  }

      else await Store.ref.set(next);
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) {
      console.error(e);
      state = prev; render();
      toast(Store.mode === "local" ? "この端末に保存できませんでした" : "保存できませんでした。ログイン状態と通信を確認してください");

        const fr = F.filter((p) => fg[p.id] === gi);
        const m = fr.filter((p) => p.gender === "男").length;
        return '<div class="grp"><div class="grp-h"><span style="display:flex;gap:8px;align-items:center"><span class="gl">' + GL[gi] + '</span><span class="mf">1年 ' + fr.length + "人（男" + m + "・女" + (fr.length - m) +
          '）</span></span><span style="display:flex;gap:8px;align-items:center"><span class="hint">新上級生</span><div class="stepper sm"><button type="button" data-need="' + gi + ':-1" aria-label="減らす"' + (locked ? " disabled" : "") + '>−</button><output class="num">' + (g.need || 0) +
          '</output><button type="button" data-need="' + gi + ':1" aria-label="増やす"' + (locked ? " disabled" : "") + ">＋</button></div></span></div>" +
          '<div class="fnames">' + (fr.map((p) => "<span>" + esc(p.name) + '<span class="m">' + esc(p.gender) + "</span></span>").join("") || '<span class="hint">1年生がいません</span>') + "</div></div>";
      }).join("") + "</div>";
      if (nSel && !locked) {
        h += '<details data-k="movef"><summary>1年生を手動で別のグループへ移す</summary><ul class="list" style="margin-top:6px">' + F.filter((p) => p.id in fg).map((p) =>
          '<li style="grid-template-columns:1fr auto"><div class="who"><b>' + esc(p.name) + "</b><small>" + personLine(p) + '</small></div><select class="mini" data-fgroup="' + p.id + '">' +
          groups.map((_, gi) => '<option value="' + gi + '"' + (fg[p.id] === gi ? " selected" : "") + ">グループ" + GL[gi] + "</option>").join("") + "</select></li>").join("") + "</ul></details>";
      }
    } else h += '<p class="hint">グループ数を1以上にしてください。</p>';
    h += "</div></section>";

    // 欠席者
    const seniors = seniorsArr().sort(L.byPriority(ui.rand));
    const absent = new Set(d.absent || []);
    h += '<section><h2><span><span class="step">5</span>自動で振り分け</span></h2><div class="panel">' +
      '<details data-k="absent"><summary>この日に来られない新上級生（' + absent.size + '人）</summary><ul class="list" style="margin-top:6px">' +
      (seniors.length ? seniors.slice().sort((a, b) => a.name.localeCompare(b.name, "ja")).map((p) => '<li style="grid-template-columns:1fr"><label class="check"><input type="checkbox" data-absent="' + p.id + '"' + (absent.has(p.id) ? " checked" : "") + (locked ? " disabled" : "") +
        '><div class="who"><b>' + esc(p.name) + "</b><small>" + personLine(p) + '</small></div><div class="pt">' + fmtPt(p.points) + "<small>pt</small></div></label></li>").join("")
        : '<li class="blank">新上級生タブで登録してください。</li>') + "</ul></details>";
    const nFm = seniors.filter((p) => p.fm).length;
    h += '<button class="btn" type="button" data-absent-fm' + (locked || !nFm ? " disabled" : "") + ">FMメンバーを取り除く（" + nFm + "人）</button>" +
      (nFm ? "" : '<p class="hint">FMの人は「部員」タブで各部員を開いて設定できます。</p>');
    const need = groups.reduce((a, g) => a + (g.need || 0), 0);
    const avail = seniors.filter((p) => !absent.has(p.id)).length;
    h += '<p class="hint">必要 ' + need + "人 ／ 来られる新上級生 " + avail + "人。1年生も含めて男女が均等になるよう、ごはんポイントが少ない人から選びます。グループは 男女のバランス → 新上級生の男女差2人以内 → 3年・2年の差1人以内 の順に整えます。</p>" +
      '<button class="btn primary" type="button" data-auto' + (locked || !need ? " disabled" : "") + ">" + (groups.some((g) => (g.sIds || []).length) ? "もう一度振り分ける" : "振り分ける") + "</button></div></section>";

    // 6. 結果の確認と手動調整
    if (groups.some((g) => (g.sIds || []).length)) {
      const assigned = new Set(groups.flatMap((g) => g.sIds || []));
      h += '<section><h2><span><span class="step">6</span>結果の確認</span><small>選び直しはプルダウンで</small></h2>';
      groups.forEach((g, gi) => {
        // 終わった日程は、その後に学年が変わった人も表示する
        const PP = people();
        const fr = locked ? Object.keys(fg).filter((id) => fg[id] === gi).map((id) => PP[id]).filter(Boolean) : F.filter((p) => fg[p.id] === gi);
        const sr = (g.sIds || []).map((sid) => (S[sid] ? { id: sid, ...S[sid] } : PP[sid])).filter(Boolean);
        const chk = L.groupWarnings(fr, sr, g.need || 0);
        h += '<div class="grp"><div class="grp-h"><span style="display:flex;gap:8px;align-items:center"><span class="gl">' + GL[gi] + '</span><span class="mf">計' + (fr.length + sr.length) + "人 男" + chk.male + "・女" + chk.female + '</span></span><div class="badges">' +
          (chk.warnings.length ? chk.warnings.map((w) => '<span class="badge ng">' + w + "</span>").join("") : '<span class="badge ok">条件OK</span>') + "</div></div>" +
          '<div class="grp-b"><div class="grp-row"><span>1年生</span><div class="names">' + (fr.map((p) => "<span>" + esc(p.name) + "<em>" + esc(p.gender || "") + "</em></span>").join("") || '<span class="hint">なし</span>') + "</div></div><div>" +
          sr.map((p) => '<div class="slot"><div class="who"><b>' + esc(p.name) + "</b><small>" + personLine(p) + fmtPt(p.points) + "pt・" + (p.count || 0) + '回</small></div>' + moveSelect(p.id, gi, groups.length, locked) + "</div>").join("") +
          "</div></div></div>";
      });
      const bench = seniors.filter((p) => !assigned.has(p.id) && !absent.has(p.id));
      if (bench.length) {
        h += '<details data-k="bench"><summary>控えの新上級生（' + bench.length + '人）から入れる</summary><ul class="list" style="margin-top:6px">' +
          bench.map((p) => '<li style="grid-template-columns:1fr auto"><div class="who"><b>' + esc(p.name) + "</b><small>" + personLine(p) + fmtPt(p.points) + "pt・" + (p.count || 0) + "回</small></div>" + moveSelect(p.id, -1, groups.length, locked) + "</li>").join("") + "</ul></details>";
      }
      h += "</section>";
    }

    h += commentsSection({ id, ...d });

    // 公開・終了
    h += '<section><h2>この日の操作</h2><div class="panel">';
    if (d.status === "draft") h += '<button class="btn yolk" type="button" data-status="published">この振り分けを部員に公開する</button><p class="hint">公開すると、ログインしていない部員にもこの日の担当が見えます。</p>';
    if (d.status === "published") h += '<button class="btn good" type="button" data-finish>ご飯会が終わった（ポイントを反映）</button><button class="btn" type="button" data-status="draft">公開をやめて準備中に戻す</button>' +
      '<p class="hint">反映すると、行った新上級生は回数+1・ポイントが「100＋(自分の回数−最小回数+1)×50−(最大回数−自分の回数)×50」になります（最大回数の人以外はそこから下の減少も）。行っていない人は「(最大回数−自分の回数+1)×15＋30×(1−P/(P+50))」減ります（P＝自分のポイント）。</p>';
    if (d.status === "done") h += '<button class="btn danger" type="button" data-undo>ポイント反映を取り消す</button><p class="hint">この日より後に反映した日程がある場合は、そちらから先に取り消してください。</p>';
    h += '<div class="row"><label class="f">日付<input type="date" id="e-date" value="' + esc(d.date) + '"' + (locked ? " disabled" : "") + '></label><label class="f">メモ<input type="text" id="e-note" maxlength="40" value="' + esc(d.note || "") + '"></label></div>' +
      '<button class="btn danger" type="button" data-del-day>この日程を削除</button></div></section>';
    return h;
  }

  // 部員を学年ごとに並べたプルダウン（値は部員の id）。disabledIds に入っている人は選べない
  function nameSelect(id, disabledIds, note) {
    const pp = people();
    const opts = [1, 2, 3, 4].map((g) => {
      const ps = Object.values(pp).filter((p) => p.grade === g).sort(byGradeName);
      return ps.length ? '<optgroup label="' + g + '年">' + ps.map((p) => {
        const off = disabledIds && disabledIds[p.id];
        return '<option value="' + esc(p.id) + '"' + (off ? " disabled" : "") + ">" + esc(p.name) + (off ? note || "" : "") + "</option>";
      }).join("") + "</optgroup>" : "";
    }).join("");
    return '<select id="' + id + '"><option value="">選んでください</option>' + opts + "</select>";
  }
  // 投稿欄の名前。部員はログイン中の名前を表示、編集者は代理で誰の名前でも選べる
  function meField(id, allowJoke) {
    if (canEdit) return '<label class="f">名前（代理で送る）' + nameSelect(id) + "</label>";
    const p = myPerson();
    // おふざけ中はコメントの名前を選べる（最初は自分）
    if (allowJoke && jokeActive()) {
      const sel = nameSelect(id).replace('<option value="' + esc(p.id) + '"', '<option value="' + esc(p.id) + '" selected');
      return '<label class="f">名前（おふざけ中）' + sel + "</label>";
    }
    return '<div class="f">名前<div class="fixed-name"><b>' + esc(p.name) + "</b><small>" + gradeChip(p.grade) + "この端末でログイン中</small></div></div>";
  }
  // 部員がまだ書けないときに投稿欄の代わりに出す案内。書けるなら ""
  function postGate(what) {
    if (canEdit) return "";
    const r = postCheck();
    if (!r) return "";
    if (r === "blocked") return '<p class="hint">この端末からは' + what + "を送れません。</p>";
    if (r === "noauth") return '<p class="hint">読み込み中…</p>';
    return '<div class="panel"><p class="hint">' + what + 'を見たり送ったりするには、名前を決めてください。</p><button class="btn primary" type="button" data-choose>名前を決める</button></div>';
  }
  const canSeePosts = () => canEdit || !!myPerson();

  // ---------- 領収書（公開中〜終了後は部員もアップロードできる） ----------
  const rcOpen = (d) => d.status === "published" || d.status === "done";
  function receiptsButton(d) {
    if (!rcOpen(d) || !canSeePosts()) return "";
    return '<button class="btn" type="button" data-receipts>領収書を見る・アップロード（' + dayReceipts(d.id).length + "件）</button>";
  }
  function receiptsView(id) {
    const d = { id, ...state.days[id] };
    const list = dayReceipts(id);
    const pp = people();
    let h = '<section><button class="btn back" data-rc-back type="button">← この日に戻る</button>' +
      '<div class="day"><div class="day-h"><div><b>' + fmtDate(d.date) + '</b> <span class="sub">' + esc(d.note || "") + "</span></div>" +
      '<span class="status st-' + d.status + '">' + STATUS[d.status] + "</span></div></div></section>" +
      '<section><h2>領収書 <small>' + list.length + "件</small></h2>";
    if (!canSeePosts()) return h + postGate("領収書") + "</section>";
    const gate = postGate("領収書");
    if (!rcOpen(d)) h += '<p class="hint">アップロードできるのは公開中と終了後の日程だけです。</p>';
    else if (gate) h += gate;
    else {
      h += '<div class="panel">' + meField("r-name") +
        '<label class="f">領収書・レシートの画像<input type="file" id="r-file" accept="image/*"></label>' +
        (ui.rcImage ? '<img class="rc-prev" src="' + ui.rcImage + '" alt="選んだ画像">' : "") +
        '<label class="f">備考（任意）<textarea id="r-note" maxlength="300" placeholder="１年生は全額、部員の補助は500円までになります。"></textarea></label>' +
        '<button class="btn primary" type="button" data-post-receipt' + (ui.rcBusy ? " disabled" : "") + ">" + (ui.rcBusy ? "アップロード中…" : "アップロード") + "</button></div>";
    }
    // 書いた人がこの日のどのグループにいたか（id で照合。古い領収書は名前で）
    const groupOf = {}, groupOfName = {};
    const mark = (id, gi) => { groupOf[id] = gi; if (pp[id]) groupOfName[pp[id].name] = gi; };
    (d.groups || []).forEach((g, gi) => (g.sIds || []).forEach((sid) => mark(sid, gi)));
    Object.entries(d.fGroup || {}).forEach(([fid, gi]) => mark(fid, gi));
    const gOf = (r) => (r.pid && r.pid in groupOf ? groupOf[r.pid] : groupOfName[r.name]);
    if (list.length) {
      h += '<div class="grp">' + list.map((r) => {
        const gi = gOf(r), name = authorName(r, pp);
        return '<div class="rc"><div class="cmt-h"><span><b>' + esc(name) + "</b>" +
          (gi !== undefined ? '<span class="chip" style="margin-left:6px">グループ' + GL[gi] + "</span>" : "") + (canEdit ? deviceTag(r, pp) : "") + "　" + fmtTime(r.at) + "</span>" +
          (canEdit ? '<button class="btn small danger" type="button" data-del-rc="' + esc(r.id) + '">削除</button>' : "") + "</div>" +
          '<img src="' + receiptUrl(r) + '" alt="' + esc(name) + 'さんの領収書" data-view-rc="' + esc(r.id) + '">' +
          (r.note ? "<p>" + esc(r.note) + "</p>" : "") + "</div>";
      }).join("") + "</div>";
    } else h += '<p class="hint">まだ領収書はありません。</p>';
    if (canEdit) h += trashBox("receipts", dayReceipts(id, true), (r) => '<img src="' + receiptUrl(r) + '" alt="" data-view-rc="' + esc(r.id) + '">' + (r.note ? "<p>" + esc(r.note) + "</p>" : ""));
    return h + "</section>";
  }

  // 編集者だけに見えるゴミ箱。body(item) で中身の表示を決める
  function trashBox(kind, items, body) {
    if (!items.length) return "";
    const pp = people();
    return '<details data-k="trash-' + kind + '" style="margin-top:10px"><summary>ゴミ箱（' + items.length + "件）</summary>" +
      '<p class="hint">部員には見えていません。「元に戻す」で一覧に戻ります。</p><div class="grp">' +
      items.map((x) => '<div class="rc"><div class="cmt-h"><span><b>' + esc(authorName(x, pp)) + jokeBy(x, pp) + "</b>　" + fmtTime(x.at) + "</span>" +
        '<span style="display:flex;gap:6px"><button class="btn small" type="button" data-trash="' + kind + ":" + esc(x.id) + ':restore">元に戻す</button>' +
        '<button class="btn small danger" type="button" data-trash="' + kind + ":" + esc(x.id) + ':purge">完全に削除</button></span></div>' + body(x) + "</div>").join("") +
      "</div></details>";
  }

  // ---------- コメント（公開中は部員も書ける） ----------
  function commentsSection(d) {
    const list = dayComments(d.id);
    const trash = canEdit ? dayComments(d.id, true) : [];
    const open = d.status === "published";
    if (!open && !list.length && !trash.length) return "";
    let h = '<section><h2>コメント <small>' + list.length + "件</small></h2>";
    if (!canSeePosts()) return h + postGate("コメント") + "</section>";
    const gate = postGate("コメント");
    if (!open) h += '<p class="hint">コメントできるのは公開中の日程だけです。</p>';
    else if (gate) h += gate;
    else {
      h += '<div class="panel">' + meField("c-name", true) +
        '<label class="f">内容<textarea id="c-text" maxlength="300" placeholder="欠席連絡はこちら。交代など当日の連絡は担当のメンバーが確定してから共有してください。"></textarea></label>' +
        '<button class="btn primary" type="button" data-post-comment>コメントを送る</button></div>';
    }
    const pp = people();
    if (list.length) {
      h += '<div class="grp">' + list.map((c) => '<div class="cmt"><div class="cmt-h"><span><b>' + esc(authorName(c, pp)) + (canEdit ? jokeBy(c, pp) : "") + "</b>" + (canEdit ? deviceTag(c, pp) : "") + "　" + fmtTime(c.at) + "</span>" +
        (canEdit ? '<button class="btn small danger" type="button" data-del-cmt="' + esc(c.id) + '">削除</button>' : "") + "</div><p>" + esc(c.text) + "</p></div>").join("") + "</div>";
    }
    h += trashBox("comments", trash, (c) => "<p>" + esc(c.text) + "</p>");
    return h + "</section>";
  }
  // 編集者向け: どの端末から書かれたか。その端末でログインしている名前と違えばそれも出す
  function deviceTag(c, pp) {
    if (!c.uid) return '<span class="chip dev">端末不明</span>';
    const own = ownersMap()[c.uid];
    const ownP = own && (pp || people())[own.pid];
    return '<span class="chip dev' + (blockedMap()[c.uid] ? " ng" : "") + '">端末 ' + devCode(c.uid) + (blockedMap()[c.uid] ? "・ブロック中" : "") + "</span>" +
      (ownP && c.pid && c.pid !== own.pid && !c.joke ? '<span class="chip dev ng">ログイン名：' + esc(ownP.name) + "</span>" : "");
  }
  // 編集者向け: おふざけモードのコメントは（本当の書き手）を添える
  function jokeBy(c, pp) {
    if (!c.joke) return "";
    const by = (pp || people())[c.by];
    return '<span class="joke-by">（' + esc(by ? by.name : "不明") + "）</span>";
  }

  // ---------- 部員リスト（編集者） ----------
  const tsMs = (t) => (t && t.toMillis ? t.toMillis() : Number(t) || 0);
  const allComments = () => (Store.mode === "local" ? Object.entries(state.comments || {}).map(([id, c]) => ({ id, ...c })) : remoteComments);
  // その部員がログインしている端末 {uid, at}（なければ null）
  const loginOf = (pid) => { const n = namesMap()[pid]; return n && n.uid ? n : null; };
  const commentsOf = (p, all) => (all || allComments()).filter((c) => (c.pid ? c.pid === p.id : c.name === p.name)).sort((a, b) => b.at - a.at);
  // その部員がおふざけモードにログインした記録 {uid, at, lastAt}（なければ null）
  function jokerOf(pid) {
    const e = Object.entries(jokersMap()).find(([, j]) => j.pid === pid);
    return e ? Object.assign({ uid: e[0] }, e[1]) : null;
  }
  const jokeChip = (pid) => { const j = jokerOf(pid); return j ? '<span class="chip joke">おふざけ' + (jokeBlockedMap()[j.uid] ? "・禁止中" : "") + "</span>" : ""; };

  function membersView() {
    const g = ui.memGrade || "all";
    const pp = people(), all = allComments();
    const list = Object.values(pp).filter((p) => g === "all" || String(p.grade) === g).sort(byGradeName);
    const filter = '<div class="seg" style="margin-bottom:8px">' + [["all", "全体"], ["1", "1年"], ["2", "2年"], ["3", "3年"], ["4", "4年"]].map(([v, l]) =>
      '<button type="button" data-memg="' + v + '" aria-pressed="' + (g === v) + '">' + l + "</button>").join("") + "</div>";
    const nLogin = list.filter((p) => loginOf(p.id)).length;
    let h = '<section><h2>部員を追加</h2><form class="panel" id="f-member"><label class="f">名前<input type="text" id="m-name" required maxlength="30" autocomplete="off" placeholder="例：山田 太郎"></label>' +
      '<div class="row"><div class="f">学年' + segHtml("m-grade", [[1, "1年"], [2, "2年"], [3, "3年"], [4, "4年"]], 4) + '</div><div class="f">性別' + segHtml("m-gender", [["男", "男"], ["女", "女"]], "男") + "</div></div>" +
      '<p class="hint">1年生は連れていく人、2・3年生はごはんポイントの対象として登録されます。4年生はログインとコメント・領収書だけができます。</p>' +
      '<button class="btn primary" type="submit">追加する</button></form></section>';
    h += '<section><h2>部員一覧 <small>' + list.length + "人（ログイン済み " + nLogin + "人）</small></h2>" + filter + '<ul class="list">' +
      (list.length ? list.map((p) => {
        const lg = loginOf(p.id), bl = lg && blockedMap()[lg.uid];
        return '<li class="tap" data-member="' + esc(p.id) + '" tabindex="0" role="button" style="grid-template-columns:1fr auto"><div class="who"><b>' + esc(p.name) + "</b><small>" + personLine(p) + jokeChip(p.id) +
          (lg ? '<span class="chip dev' + (bl ? " ng" : "") + '">端末 ' + devCode(lg.uid) + (bl ? "・ブロック中" : "") + "</span>" : '<span class="chip">未ログイン</span>') +
          '</small></div><div class="pt">' + commentsOf(p, all).length + "<small>件</small></div></li>";
      }).join("") : '<li class="blank">この学年の部員はいません。</li>') + "</ul></section>";
    return h + orphanDevices(pp, all);
  }

  // 名前と結びついていない端末（ログインを解除した後にブロックしたい場合など）
  function orphanDevices(pp, all) {
    const blocked = blockedMap(), owners = ownersMap(), names = namesMap();
    const bound = (u) => { const o = owners[u]; return o && pp[o.pid] && names[o.pid] && names[o.pid].uid === u; };
    const count = {};
    all.forEach((c) => { if (c.uid) count[c.uid] = (count[c.uid] || 0) + 1; });
    const ids = Array.from(new Set(Object.keys(blocked).concat(Object.keys(count)))).filter((u) => !bound(u) && !(canEdit && u === myUid()));
    if (!ids.length) return "";
    const nameOf = (u) => (blocked[u] && blocked[u].name) || (all.find((c) => c.uid === u) || {}).name || "";
    return '<section><h2>名前と結びついていない端末 <small>' + ids.length + "台</small></h2>" +
      '<p class="hint">ログインを解除した端末や、以前の仕組みでコメントした端末です。</p><ul class="list">' +
      ids.map((u) => '<li style="grid-template-columns:1fr auto"><div class="who"><b>' + (esc(nameOf(u)) || "（名前なし）") + "</b><small>" +
        '<span class="chip dev' + (blocked[u] ? " ng" : "") + '">端末 ' + devCode(u) + (blocked[u] ? "・ブロック中" : "") + "</span>コメント " + (count[u] || 0) + "件</small></div>" +
        (blocked[u] ? '<button class="btn small" type="button" data-unblock="' + esc(u) + '">ブロック解除</button>'
          : '<button class="btn small danger" type="button" data-block="' + esc(u) + '">ブロック</button>') + "</li>").join("") + "</ul></section>";
  }

  // 学年に合わせて保存先（1年 / 2・3年 / 4年）を移す。まだ終わっていない日程の振り分けからは外す
  const catOf = (grade) => (grade === 1 ? "freshmen" : grade === 4 ? "elders" : "seniors");
  function updatePerson(pid, name, grade, gender, fm) {
    return save((s) => {
      s.elders = s.elders || {};
      const from = ["freshmen", "seniors", "elders"].find((k) => s[k][pid]);
      if (!from) return;
      const to = catOf(grade);
      const rec = Object.assign({}, s[from][pid], { name, gender });
      // FM は2年生以上だけ
      if (fm && grade >= 2) rec.fm = true; else delete rec.fm;
      if (to === "seniors") { rec.grade = grade; rec.count = rec.count || 0; rec.points = rec.points || 0; } else delete rec.grade;
      if (from !== to) {
        delete s[from][pid];
        Object.values(s.days).forEach((d) => {
          if (d.status === "done") return;
          if (from === "seniors") { (d.groups || []).forEach((g) => { g.sIds = (g.sIds || []).filter((x) => x !== pid); }); d.absent = (d.absent || []).filter((x) => x !== pid); }
          if (from === "freshmen" && d.fGroup) delete d.fGroup[pid];
        });
      }
      s[to][pid] = rec;
    }, "保存しました");
  }
  async function deletePerson(pid) {
    const lg = loginOf(pid);
    const ok = await save((s) => {
      ["freshmen", "seniors", "elders"].forEach((k) => { if (s[k]) delete s[k][pid]; });
      Object.values(s.days).forEach((d) => {
        if (d.status === "done") return;
        (d.groups || []).forEach((g) => { g.sIds = (g.sIds || []).filter((x) => x !== pid); });
        d.absent = (d.absent || []).filter((x) => x !== pid);
        if (d.fGroup) delete d.fGroup[pid];
      });
    }, "削除しました");
    if (ok && lg) await releaseOwner(lg.uid);
    return ok;
  }

          "</div><p>" + esc(c.text) + "</p></div>").join("") + "</div>"

      if (rel) rel.onclick = (e) => { if (armed(e.currentTarget, "もう一度押すと解除")) releaseOwner(lg.uid).then(close); };

  }

  // ================= 操作 =================
  const segVal = (name) => { const b = $('[data-seg="' + name + '"] button[aria-pressed="true"]'); return b ? b.dataset.v : null; };

  function updDay(fn, msg) { const id = ui.dayId; return save((s) => fn(s.days[id], s), msg); }

  function setGroupCount(day, n) {
    const groups = day.groups || [];
    n = Math.max(0, Math.min(GL.length, n));
    while (groups.length < n) groups.push({ need: 2, sIds: [] });
    while (groups.length > n) groups.pop();
    day.groups = groups;
    Object.keys(day.fGroup || {}).forEach((fid) => { if (day.fGroup[fid] >= n) day.fGroup[fid] = Math.max(0, n - 1); });
  }

  function autoAssign(day, s) {
    const S = s.seniors, F = s.freshmen;
    const absent = new Set(day.absent || []);
    ui.rand = {}; Object.keys(S).forEach((id) => { ui.rand[id] = Math.random(); });
    const cands = Object.entries(S).filter(([id]) => !absent.has(id)).map(([id, v]) => ({ id, ...v }));
    const total = day.groups.reduce((a, g) => a + (g.need || 0), 0);
    const groups = day.groups.map((g, gi) => ({
      need: g.need || 0,
      freshmen: Object.entries(day.fGroup || {}).filter(([, x]) => x === gi).map(([id]) => F[id] && { id, ...F[id] }).filter(Boolean),
    }));
    const chosen = L.selectSeniors(cands, total, ui.rand, [].concat(...groups.map((g) => g.freshmen)));
    const res = L.distribute(groups, chosen, cands.filter((p) => !chosen.includes(p)));
    day.groups.forEach((g, gi) => { g.sIds = res[gi]; });
    return chosen.length < total ? "来られる新上級生が" + (total - chosen.length) + "人足りません" : "振り分けました。内容を確認してください";
  }

      // スマホやアプリ内ブラウザでは clipboard API が使えないことがあるので、昔ながらの方法を先に試す
      if (copyByTextarea(url)) { ok(); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(ok, () => showLink(url));
      return;
    }
    const od = t.closest("[data-open-day]");
    if (od) { go({ dayId: od.dataset.openDay }); return; }
    const seg = t.closest("[data-seg] button");
    if (seg) { $$("button", seg.parentNode).forEach((b) => b.setAttribute("aria-pressed", b === seg)); return; }
    const es = t.closest("[data-edit-s]");
    if (es && canEdit) { openSenior(es.dataset.editS); return; }
    const ef = t.closest("[data-edit-f]");
    if (ef && canEdit) { openFreshman(ef.dataset.editF); return; }
    if (!canEdit || !ui.dayId) return;

    const gc = t.closest("[data-gcount]");
    if (gc) { updDay((d) => setGroupCount(d, (d.groups || []).length + Number(gc.dataset.gcount))); return; }
    const nd = t.closest("[data-need]");
    if (nd) { const [gi, dv] = nd.dataset.need.split(":").map(Number); updDay((d) => { d.groups[gi].need = Math.max(0, Math.min(20, (d.groups[gi].need || 0) + dv)); }); return; }
    const sp = t.closest("[data-split]");
    if (sp) {
      const random = sp.dataset.split === "random";
      updDay((d, s) => {
        const fr = Object.keys(d.fGroup || {}).map((id) => s.freshmen[id] && { id, ...s.freshmen[id] }).filter(Boolean);
        d.fGroup = random ? L.randomSplit(fr, d.groups.length) : L.splitFreshmen(fr, d.groups.length);
      }, random ? "1年生をランダムに分けました" : "1年生を男女均等に分けました");
      return;
    }
    const af = t.closest("[data-all-f]");
    if (af) {
      const on = af.dataset.allF === "1";
      updDay((d, s) => {
        d.fGroup = d.fGroup || {};
        if (on) {
          if (!(d.groups || []).length) setGroupCount(d, 1);
          Object.keys(s.freshmen).forEach((id) => { if (!(id in d.fGroup)) d.fGroup[id] = 0; });
        } else d.fGroup = {};
      }, on ? "1年生を全員選びました" : "1年生の選択を外しました");
      return;
    }
    if (t.closest("[data-absent-fm]")) {
      // FM に所属する新上級生を全員「この日に来られない」にして、振り分け済みなら外す
      const fmIds = Object.entries(state.seniors).filter(([, p]) => p.fm).map(([id]) => id);
      updDay((d) => {
        const a = new Set(d.absent || []);
        fmIds.forEach((id) => a.add(id));
        d.absent = Array.from(a);
        (d.groups || []).forEach((g) => { g.sIds = (g.sIds || []).filter((x) => !fmIds.includes(x)); });
      }, "FMメンバー " + fmIds.length + "人を、この日に来られない人にしました");
      return;
    }
    if (t.closest("[data-auto]")) { let msg; updDay((d, s) => { msg = autoAssign(d, s); }).then((ok) => ok && toast(msg)); return; }
    const st = t.closest("[data-status]");
    if (st) { const v = st.dataset.status; updDay((d) => { d.status = v; }, v === "published" ? "部員に公開しました" : "準備中に戻しました"); return; }
    if (t.closest("[data-finish]")) {
      const b = t.closest("[data-finish]");
      if (!armed(b, "もう一度押すとポイントを反映します")) return;
      updDay((d, s) => {
        const went = (d.groups || []).flatMap((g) => g.sIds || []).filter((id) => s.seniors[id]);
        const r = L.applyMeal(Object.entries(s.seniors).map(([id, v]) => ({ id, ...v })), went);
        Object.entries(r.next).forEach(([id, v]) => { s.seniors[id].count = v.count; s.seniors[id].points = v.points; });
        d.before = r.before; d.appliedAt = Date.now(); d.status = "done";
      }, "ポイントを反映しました");
      return;
    }
    if (t.closest("[data-undo]")) {
      const b = t.closest("[data-undo]");
      const d0 = state.days[ui.dayId];
      const later = Object.values(state.days).some((x) => x.status === "done" && (x.appliedAt || 0) > (d0.appliedAt || 0));
      if (later) { toast("後に反映した日程があります。そちらを先に取り消してください"); return; }
      if (!armed(b, "もう一度押すと取り消します")) return;
      updDay((d, s) => {
        Object.entries(d.before || {}).forEach(([id, v]) => { if (s.seniors[id]) { s.seniors[id].count = v.count; s.seniors[id].points = v.points; } });
        delete d.before; delete d.appliedAt; d.status = "published";
      }, "ポイント反映を取り消しました");
      return;
    }
    if (t.closest("[data-del-day]")) {
      const b = t.closest("[data-del-day]");
      if (state.days[ui.dayId].status === "done") { toast("ポイント反映を取り消してから削除してください"); return; }
      if (!armed(b, "もう一度押すと削除します")) return;
      const id = ui.dayId;
      ui.dayId = null;
      save((s) => { delete s.days[id]; }, "日程を削除しました");
    }
  });

  function armed(b, text) {
    if (b.classList.contains("armed")) return true;
    const orig = b.textContent;
    b.classList.add("armed"); b.textContent = text;
    setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = orig; } }, 3500);
    return false;
  }

  document.addEventListener("keydown", (ev) => {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[role=button][tabindex]")) { ev.preventDefault(); ev.target.click(); }
  });

  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "r-file" && t.files && t.files[0]) {
      toast("画像を縮小しています…");
      compressImage(t.files[0]).then((data) => {
        if (!data) { toast("画像が大きすぎて縮小できませんでした"); return; }
        ui.rcImage = data; render();
      }, () => toast("この画像は読み込めませんでした"));
      return;
    }
    if (t.id === "restore-file" && canEdit && t.files && t.files[0]) {
      const file = t.files[0];
      t.value = "";
      file.text().then((txt) => {
        let b = null;
        try { b = JSON.parse(txt); } catch (e) {}
        if (!isBackup(b)) { toast("このファイルはバックアップではありません"); return; }
        const m = normalize(b.main);
        sheet("<h3>バックアップから復元</h3>" +
          '<p class="hint">' + new Date(b.savedAt).toLocaleString("ja-JP") + " に保存したバックアップです。<br>日程 " + Object.keys(m.days).length +
          "件・新上級生 " + Object.keys(m.seniors).length + "人・1年生 " + Object.keys(m.freshmen).length + "人・コメント " + Object.keys(b.comments || {}).length +
          "件・領収書 " + Object.keys(b.receipts || {}).length + "件</p>" +
          '<p class="hint">日程とメンバーはこの時点に戻ります。復元の直前に、今の状態を自動でバックアップします。</p>' +
          '<button class="btn danger" type="button" id="do-restore">復元する</button><button class="btn" type="button" data-close>やめる</button>', (close) => {
          $("#do-restore").addEventListener("click", async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true; btn.textContent = "復元しています…";
            try {
              await downloadBackup();
              await restoreBackup(b);
              close(); toast("復元しました");
            } catch (err) {
              console.error(err); btn.disabled = false; btn.textContent = "復元する";
              toast("復元できませんでした。ログイン状態と通信を確認してください");
            }
          });
        });
      });
      return;
    }
    if (!canEdit || !ui.dayId) return;
    if (t.dataset.pickF) {
      const id = t.dataset.pickF, on = t.checked;
      updDay((d) => {
        d.fGroup = d.fGroup || {};
        if (on) { if (!(d.groups || []).length) setGroupCount(d, 1); d.fGroup[id] = 0; } else delete d.fGroup[id];
      });
    } else if (t.dataset.fgroup) {
      const id = t.dataset.fgroup, gi = Number(t.value);
      updDay((d) => { d.fGroup[id] = gi; });
    } else if (t.dataset.absent) {
      const id = t.dataset.absent, on = t.checked;
      updDay((d) => {
        const a = new Set(d.absent || []); on ? a.add(id) : a.delete(id); d.absent = Array.from(a);
        if (on) d.groups.forEach((g) => { g.sIds = (g.sIds || []).filter((x) => x !== id); });
      });
    } else if (t.dataset.move) {
      const id = t.dataset.move, gi = Number(t.value);
      updDay((d) => {
        d.groups.forEach((g) => { g.sIds = (g.sIds || []).filter((x) => x !== id); });
        if (gi >= 0) d.groups[gi].sIds.push(id);
      });
    } else if (t.id === "e-date" && t.value) {
      const v = t.value; updDay((d) => { d.date = v; }, "日付を変更しました");
    } else if (t.id === "e-note") {
      const v = t.value.trim().slice(0, 40); updDay((d) => { d.note = v; }, "メモを保存しました");
    }
  });

  document.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const f = ev.target;
    if (!canEdit) return;
    if (f.id === "f-day") {
      const id = uid();
      const date = $("#d-date").value || today(), note = $("#d-note").value.trim().slice(0, 40);
      save((s) => { s.days[id] = { date, note, status: "draft", fGroup: {}, groups: [{ need: 2, sIds: [] }], absent: [], createdAt: Date.now() }; })
        .then((ok) => ok && go({ dayId: id }));
    } else if (f.id === "f-senior") {
      const name = $("#s-name").value.trim().slice(0, 30);
      if (!name) return;
      if (Object.values(people()).some((p) => p.name === name)) { toast("同じ名前の人がすでにいます"); return; }
      const rec = { name, grade: Number(segVal("s-grade")), gender: segVal("s-gender"), count: Math.max(0, parseInt($("#s-count").value, 10) || 0), points: parseFloat($("#s-points").value) || 0 };
      save((s) => { s.seniors[uid()] = rec; }, name + " さんを追加しました").then((ok) => ok && $("#s-name") && $("#s-name").focus());
    } else if (f.id === "f-fresh") {
      const name = $("#fr-name").value.trim().slice(0, 30);
      if (!name) return;
      if (Object.values(people()).some((p) => p.name === name)) { toast("同じ名前の人がすでにいます"); return; }
      const rec = { name, gender: segVal("fr-gender") };
      save((s) => { s.freshmen[uid()] = rec; }, name + " さんを追加しました").then((ok) => ok && $("#fr-name") && $("#fr-name").focus());
    } else if (f.id === "f-member") {
      const name = $("#m-name").value.trim().slice(0, 30);
      if (!name) return;
      if (Object.values(people()).some((p) => p.name === name)) { toast("同じ名前の人がすでにいます"); return; }
      const grade = Number(segVal("m-grade")), gender = segVal("m-gender"), to = catOf(grade);
      const rec = to === "seniors" ? { name, grade, gender, count: 0, points: 0 } : { name, gender };
      save((s) => { s.elders = s.elders || {}; s[to][uid()] = rec; }, name + " さん（" + grade + "年）を追加しました").then((ok) => ok && $("#m-name") && $("#m-name").focus());
    }
  });

  // ================= シート（編集・ログイン） =================
  // sticky = true のときは外側タップや Esc では閉じない（必ずどれかを選んでもらう画面用）
  function sheet(html, onReady, sticky) {
    const root = $("#sheet-root");
    root.innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">' + html + "</div></div>";
    const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
    function onKey(e) { if (e.key === "Escape" && !sticky) close(); }
    document.addEventListener("keydown", onKey);
    $("#scrim").addEventListener("click", (e) => { if ((e.target.id === "scrim" && !sticky) || e.target.closest("[data-close]")) close(); });
    onReady(close);
  }
  function copyByTextarea(text) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.readOnly = true;
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return done;
  }
  // コピーできなかったときは、リンクを見せて長押しでコピーしてもらう
  function showLink(url) {
    sheet('<h3>部員に送るリンク</h3><p class="hint">自動でコピーできませんでした。下のリンクを長押ししてコピーしてください。</p>' +
      '<textarea readonly id="link-box" rows="3" style="font-size:16px">' + esc(url) + "</textarea>" +
      (navigator.share ? '<button class="btn primary" type="button" id="link-share">LINEなどで共有する</button>' : "") +
      '<button class="btn" type="button" data-close>閉じる</button>', () => {
      const box = $("#link-box"); box.focus(); box.select();
      const sh = $("#link-share");
      if (sh) sh.addEventListener("click", () => navigator.share({ url }).catch(() => {}));
    });
  }
  const segHtml = (name, opts, cur) => '<div class="seg" data-seg="' + name + '">' + opts.map(([v, l]) => '<button type="button" data-v="' + v + '" aria-pressed="' + (String(v) === String(cur)) + '">' + l + "</button>").join("") + "</div>";

  function openSenior(id) {
    const p = state.seniors[id]; if (!p) return;
    sheet('<h3>' + esc(p.name) + '</h3><label class="f">名前<input type="text" id="x-name" maxlength="30" value="' + esc(p.name) + '"></label>' +
      '<div class="row"><div class="f">学年' + segHtml("x-grade", [[2, "2年"], [3, "3年"]], p.grade) + '</div><div class="f">性別' + segHtml("x-gender", [["男", "男"], ["女", "女"]], p.gender) + "</div></div>" +
      '<div class="row"><label class="f">今までご飯に行った回数<input type="number" id="x-count" min="0" value="' + (p.count || 0) + '" inputmode="numeric"></label>' +
      '<label class="f">ごはんポイント<input type="number" id="x-points" value="' + (p.points || 0) + '" step="any" inputmode="decimal"></label></div>' +
      '<div class="btns"><button class="btn" type="button" data-close>閉じる</button><button class="btn primary" type="button" id="x-save">保存</button></div>' +
      '<button class="btn danger" type="button" id="x-del">この人を削除</button>', (close) => {
      $("#x-save").onclick = () => {
        const name = $("#x-name").value.trim().slice(0, 30); if (!name) { toast("名前を入力してください"); return; }
        const rec = { name, grade: Number(segVal("x-grade")), gender: segVal("x-gender"), count: Math.max(0, parseInt($("#x-count").value, 10) || 0), points: parseFloat($("#x-points").value) || 0 };
        save((s) => { Object.assign(s.seniors[id], rec); }, "保存しました").then((ok) => ok && close());
      };
      $("#x-del").onclick = (e) => {
        if (!armed(e.currentTarget, "もう一度押すと削除します")) return;
        save((s) => { delete s.seniors[id]; Object.values(s.days).forEach((d) => { if (d.status !== "done") (d.groups || []).forEach((g) => { g.sIds = (g.sIds || []).filter((x) => x !== id); }); }); }, "削除しました").then((ok) => ok && close());
      };
    });
  }

  function openFreshman(id) {
    const p = state.freshmen[id]; if (!p) return;
    sheet('<h3>' + esc(p.name) + '</h3><label class="f">名前<input type="text" id="x-name" maxlength="30" value="' + esc(p.name) + '"></label>' +
      '<div class="f">性別' + segHtml("x-gender", [["男", "男"], ["女", "女"]], p.gender) + "</div>" +
      '<div class="btns"><button class="btn" type="button" data-close>閉じる</button><button class="btn primary" type="button" id="x-save">保存</button></div>' +
      '<button class="btn danger" type="button" id="x-del">この人を削除</button>', (close) => {
      $("#x-save").onclick = () => {
        const name = $("#x-name").value.trim().slice(0, 30); if (!name) { toast("名前を入力してください"); return; }
        const gender = segVal("x-gender");
        save((s) => { Object.assign(s.freshmen[id], { name, gender }); }, "保存しました").then((ok) => ok && close());
      };
      $("#x-del").onclick = (e) => {
        if (!armed(e.currentTarget, "もう一度押すと削除します")) return;
        save((s) => { delete s.freshmen[id]; Object.values(s.days).forEach((d) => { if (d.status !== "done" && d.fGroup) delete d.fGroup[id]; }); }, "削除しました").then((ok) => ok && close());
      };
    });
  }

  function openLogin() {
    sheet('<h3>編集ログイン</h3><p class="hint">編集できるのは管理者だけです。部員の方はログインしなくても担当を見られます。</p>' +
      '<form id="x-login" style="display:flex;flex-direction:column;gap:12px"><label class="f">メールアドレス<input type="email" id="x-mail" autocomplete="username" required></label>' +
      '<label class="f">パスワード<input type="password" id="x-pass" autocomplete="current-password" required></label>' +
      '<div class="btns"><button class="btn" type="button" data-close>閉じる</button><button class="btn primary" type="submit">ログイン</button></div></form>', (close) => {
      $("#x-login").addEventListener("submit", (e) => {
        e.preventDefault(); e.stopPropagation();
        const mail = $("#x-mail").value.trim(), pass = $("#x-pass").value;
        // まず編集ログインを試し、通らなければおふざけモードの合言葉として試す
        // （おふざけモードに入ったことのある端末でも、編集者の情報なら必ず編集ログインになる）
        const editorLogin = Store.mode === "local" ? Promise.reject() : editorAuth().signInWithEmailAndPassword(mail, pass);
        editorLogin.then(() => { setJoke(false); close(); toast("ログインしました"); }, () =>
          tryJoke(mail, pass).then((joke) => {
            if (joke) { close(); toast("おふざけモード ON"); render(); return; }
            toast("メールアドレスかパスワードが違います");
          })
        ).catch(() => toast("メールアドレスかパスワードが違います"));
      });
    });
  }

  // 使い方。部員向けを全員に、編集者向けはログイン中の編集者にだけ出す
  function openHelp() {
    sheet('<h3>使い方</h3><div class="howto">' +
      '<p class="hint">「一年生をご飯に連れていく会」の担当を、ごはんポイントで公平に決めるアプリです。</p>' +
      "<h4>はじめに</h4><ul>" +
      "<li>最初に開いたとき、<b>自分の名前</b>を選びます。本人以外の名前は選ばないでください。一度決めると変更できず、その端末に保存されます。</li>" +
      "<li>名前が見つからないときは「この中に名前がない」を選ぶと、グループだけ見られます。あとから画面上の「名前を決める」で選べます。</li></ul>" +
      "<h4>日程・グループを見る</h4><ul>" +
      "<li>「日程」タブで公開中の日をタップすると、グループごとのメンバー（新上級生と1年生）が見られます。</li></ul>" +
      "<h4>コメント</h4><ul>" +
      "<li>欠席の連絡は、その日のコメントに書いてください。交代など当日の連絡は、担当のメンバーが決まってから共有してください。</li></ul>" +
      "<h4>領収書</h4><ul>" +
      "<li>ご飯のあと、その日の「領収書を見る・アップロード」からレシートの写真を送ります。金額などは備考へ。1年生は全額、部員の補助は500円までです。</li></ul>" +
      "<h4>ごはんポイント</h4><ul>" +
      "<li>ポイントが少ない人ほど、次の担当に選ばれやすくなります。ご飯に行くとポイントが上がり、行かなかった人は少しずつ下がります。</li></ul>" +
      "<h4>困ったとき</h4><ul>" +
      "<li>機種変更などで名前を選び直したいとき、間違えて別の名前を選んだときは、管理者に連絡してください。</li></ul>" +
      (canEdit ? "<h4>編集者の流れ</h4><ol>" +
        "<li>「日程」タブで日付を作る</li>" +
        "<li>連れていく1年生を選び、グループに分ける（男女均等・ランダム）</li>" +
        "<li>グループごとの新上級生の人数を決め、来られない人にチェックして「振り分ける」</li>" +
        "<li>結果を確認・調整して「部員に公開する」</li>" +
        "<li>ご飯会が終わったら「ポイントを反映」（間違えたら取り消せます）</li></ol>" +
        "<h4>編集者のその他の機能</h4><ul>" +
        "<li>「部員」タブ：部員の追加（4年生も）、学年・性別の変更、ログイン中の端末の確認、ログイン解除、ブロック、コメント履歴</li>" +
        "<li>コメント・領収書の削除はまずゴミ箱へ入り、元に戻せます</li>" +
        "<li>日程一覧の一番下の「バックアップを保存」で、全データをファイルに保存できます。ご飯会のあとに保存しておくと安心です</li></ul>" : "") +
      '</div><button class="btn" type="button" data-close>閉じる</button>', () => {});
  }

  let toastT;
  function toast(text) {
    let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = text; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600);
  }

  window.addEventListener("hashchange", () => location.reload());
  render();
  startStore();
})();
</script>
</body>
</html>
